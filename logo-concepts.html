<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- keep this site out of search engines (also robots.txt + X-Robots-Tag in vercel.json) -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>AARMBH Logo Concepts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Shrikhand&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07060c; --bg-2: #0d0b16; --bg-3: #151226;
      --ink: #f6f2ea; --muted: #9b96ab; --line: rgba(255, 255, 255, .09);
      --gold: #ffb84d; --rose: #ff4d8d; --violet: #8b5cf6; --cyan: #3ee6ff;
      --grad: linear-gradient(100deg, var(--gold), var(--rose) 50%, var(--violet));
      --tile: #0d0b16; --mk-ink: #f6f2ea; --tile-line: rgba(255, 255, 255, .07);
    }
    body.light-tiles { --tile: #f7f3ec; --mk-ink: #17131f; --tile-line: rgba(0, 0, 0, .08); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 96px; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 720px) { .wrap { padding: 0 32px; } }

    header { padding: 56px 0 28px; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
    h1 { font: 800 clamp(34px, 6vw, 64px)/1.02 "Syne", sans-serif; letter-spacing: -.02em; margin: 12px 0 14px; }
    h1 em { font: italic 400 1.05em "Instrument Serif", serif; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lede { color: var(--muted); max-width: 640px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 4px; background: var(--bg-2); }
    .seg button { padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--bg-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

    section { padding: 34px 0 10px; }
    .set-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .set-head h2 { font: 700 22px "Syne", sans-serif; }
    .set-head span { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }

    .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .25s, box-shadow .25s; }
    .card.picked { border-color: var(--rose); box-shadow: 0 0 0 1px var(--rose), 0 0 40px rgba(255, 77, 141, .18); }
    .tile { position: relative; background: var(--tile); aspect-ratio: 4 / 3.3; display: grid; place-items: center; align-content: center; gap: 14px; border-bottom: 1px solid var(--tile-line); transition: background .3s; }
    .tile .mark { width: 46%; max-width: 150px; aspect-ratio: 1; }
    .num { position: absolute; top: 14px; left: 16px; font: 700 13px "Syne", sans-serif; color: var(--mk-ink); opacity: .55; }
    .badge { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; background: var(--grad); color: #120d18; }
    .meta { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .meta h3 { font: 700 17px "Syne", sans-serif; }
    .meta p { color: var(--muted); font-size: 13.5px; flex: 1; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 7px; border-radius: 99px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); backdrop-filter: blur(8px); }
    .pill svg { width: 28px; height: 28px; }
    .pill b { font: 800 12px "Syne", sans-serif; letter-spacing: .06em; }
    .pill i { font: italic 400 14px "Instrument Serif", serif; margin-left: 2px; color: var(--muted); }
    .fav { display: inline-flex; align-items: end; gap: 6px; }
    .fav span { background: #1c1830; border-radius: 6px; display: grid; place-items: center; }
    .fav span:first-child { width: 34px; height: 34px; } .fav span:first-child svg { width: 26px; height: 26px; }
    .fav span:last-child { width: 22px; height: 22px; border-radius: 4px; } .fav span:last-child svg { width: 16px; height: 16px; }
    .sizes { color: var(--muted); font-size: 11px; }
    .pick { margin-left: auto; padding: 8px 14px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--bg-3); }
    .card.picked .pick { background: var(--grad); color: #120d18; border-color: transparent; }

    /* wordmarks */
    .wm { color: var(--mk-ink); text-align: center; line-height: 1; }
    .wm b { font: 800 clamp(17px, 2.2vw, 21px) "Syne", sans-serif; letter-spacing: .14em; }
    .wm em { font: italic 400 clamp(18px, 2.4vw, 23px) "Instrument Serif", serif; margin-left: 4px; letter-spacing: 0; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .wm-shiro b { display: inline-block; border-top: 3px solid var(--rose); padding-top: 5px; }
    .wm-sig b { font: 400 34px "Great Vibes", cursive; letter-spacing: 0; }
    .wm-sig em { display: block; font: 700 10px "Manrope", sans-serif; letter-spacing: .5em; margin: 4px 0 0; text-transform: uppercase; }
    .wm-serif b { font: italic 400 28px "Instrument Serif", serif; letter-spacing: .01em; }
    .wm-serif em { font-style: italic; }
    .wm-retro b { font: 400 25px "Shrikhand", cursive; letter-spacing: .01em; text-shadow: 2px 2px 0 var(--violet); }
    .wm-retro em { font: 400 18px "Shrikhand", cursive; }
    .wm-bounce b span { display: inline-block; }
    .wm-bounce b span:nth-child(even) { transform: translateY(-4px); }
    .wm-ticket b { letter-spacing: .3em; }
    .wm-ticket em { display: block; font: 700 10px "Manrope", sans-serif; letter-spacing: .6em; margin: 6px 0 0; text-transform: uppercase; }

    /* mark helpers + motion */
    .ink { fill: var(--mk-ink); }
    .tilefill { fill: var(--tile); }
    .spin { transform-origin: 60px 60px; animation: spin 26s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ball { animation: bounce 1.1s cubic-bezier(.5, 0, .5, 1) infinite alternate; }
    @keyframes bounce { to { transform: translateY(-30px); } }
    .shadow { transform-box: fill-box; transform-origin: center; animation: squash 1.1s cubic-bezier(.5, 0, .5, 1) infinite alternate; }
    @keyframes squash { to { transform: scaleX(.45); opacity: .25; } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1.6s ease-in-out infinite alternate; }
    @keyframes eq { to { transform: scaleY(.9); } }
    .flicker { transform-box: fill-box; transform-origin: bottom center; animation: flick 2.4s ease-in-out infinite alternate; }
    @keyframes flick { 50% { transform: scale(.96, 1.04) skewX(-2deg); } to { transform: scale(1.02, .97) skewX(2deg); } }
    body.still .spin, body.still .ball, body.still .shadow, body.still .bar, body.still .flicker { animation: none; }
    @media (prefers-reduced-motion: reduce) { .spin, .ball, .shadow, .bar, .flicker { animation: none; } }

    .dock { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 99px; background: rgba(21, 18, 38, .88); border: 1px solid var(--line); backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
    .dock .label { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dock .label strong { color: var(--gold); }
    .dock button { padding: 9px 16px; border-radius: 99px; background: var(--grad); color: #120d18; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .dock button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <!-- Shared gradients, filters and paths used by every mark -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" x2="1" y1="0" y2=".25"><stop offset="0" stop-color="#ffb84d"/><stop offset=".5" stop-color="#ff4d8d"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
      <linearGradient id="gv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffb84d"/><stop offset=".55" stop-color="#ff4d8d"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
      <linearGradient id="gu" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="110" y2="0"><stop offset="0" stop-color="#ffb84d"/><stop offset=".5" stop-color="#ff4d8d"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
      <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffe09a"/><stop offset=".5" stop-color="#ffb84d"/><stop offset="1" stop-color="#e0782c"/></linearGradient>
      <linearGradient id="flame" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff4d8d"/><stop offset=".45" stop-color="#ffb84d"/><stop offset="1" stop-color="#ffe7a8"/></linearGradient>
      <radialGradient id="rg"><stop offset="0" stop-color="#ffb84d" stop-opacity=".75"/><stop offset=".5" stop-color="#ff4d8d" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
      <path id="sealPath" d="M60 60 m-45 0 a45 45 0 1 1 90 0 a45 45 0 1 1 -90 0"/>
      <mask id="eqMask" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120"><rect width="120" height="120" fill="#fff"/><rect x="0" y="74" width="120" height="6" fill="#000"/></mask>
    </defs>
  </svg>

  <header class="wrap">
    <div class="eyebrow">AARMBH MEDIA · Logo exploration</div>
    <h1>18 marks, <em>one beginning.</em></h1>
    <p class="lede">Each concept is shown large, as a wordmark, inside the floating nav pill from the website, and at favicon size. Pick one, or pick two or three to mix, then tell me the numbers.</p>
    <div class="controls">
      <div class="seg" role="group" aria-label="Tile background">
        <button type="button" data-bg="dark" aria-pressed="true">Dark tiles</button>
        <button type="button" data-bg="light" aria-pressed="false">Light tiles</button>
      </div>
      <div class="seg" role="group" aria-label="Motion">
        <button type="button" data-motion="on" aria-pressed="true">Motion on</button>
        <button type="button" data-motion="off" aria-pressed="false">Still</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="sets"></main>

  <div class="dock" role="status">
    <div class="label" id="pickLabel">Tap <strong>Pick</strong> on any concept</div>
    <button type="button" id="copyBtn" disabled>Copy my pick</button>
  </div>

  <script>

    const rot = (deg, el) => `<g transform="rotate(${deg} 60 60)">${el}</g>`;
    const range = (n) => Array.from({ length: n }, (_, i) => i);

    const MARKS = {
      1: `<path d="M60 22 L24 104 H96 Z" fill="url(#g)" opacity=".12"/>
          <path d="M60 22 L26 104 H40 L60 56 L80 104 H94 Z" fill="url(#g)"/>

         `<path d="M22 78 A38 38 0 0 1 98 78 Z" fill="url(#gv)"/>

          <circle cx="60" cy="60" r="33" fill="none" stroke="url(#g)" stroke-width="2"/>
          <text x="60" y="76" text-anchor="middle" font-family="Syne" font-weight="800" font-size="44" fill="url(#g)">A</text>`,

         `<circle cx="60" cy="60" r="10" fill="#ffb84d"/><circle cx="60" cy="60" r="4.5" class="tilefill"/>`,
      8: `<text x="58" y="88" text-anchor="middle" font-family="Great Vibes" font-size="92" fill="url(#g)">A</text>

          <path d="M104 72 L106 80 L114 82 L106 84 L104 92 L102 84 L94 82 L102 80 Z" fill="#ffb84d" filter="url(#glow)"/>`,

           `<path d="M60 30 C74 50 74 74 60 90 C46 74 46 50 60 30Z" fill="url(#g)" opacity="${o}" transform="rotate(${d} 60 90) translate(60 90) scale(${s}) translate(-60 -90)"/>`).join('') +

           <text x="60" y="92" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="86" ${ink}>A</text>`,
      11: `<path d="M12 100 A48 48 0 0 1 108 100" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/>

           <text x="63" y="105" text-anchor="middle" font-family="Shrikhand" font-size="58" fill="#8b5cf6">A</text>

      12: `<text x="60" y="88" text-anchor="middle" font-family="Syne" font-weight="800" font-size="72" fill="url(#g)">A</text>

      14: range(16).map(i => rot(i * 22.5, `<circle cx="60" cy="6" r="2" fill="#ffb84d"/>`)).join('') +

      15: range(24).filter(i => i < 9 || i > 15).map(i => { const t = i * 15 * Math.PI / 180;

      17: `<g transform="rotate(-8 60 60)">
             <path d="M18 30 H102 Q110 30 110 38 V52 A8 8 0 0 0 110 68 V82 Q110 90 102 90 H18 Q10 90 10 82 V68 A8 8 0 0 0 10 52 V38 Q10 30 18 30Z" fill="url(#gold)"/>
             <rect x="16" y="36" width="88" height="48" rx="4" fill="none" stroke="#5a2e0e" stroke-opacity=".35"/>
             <line x1="84" y1="34" x2="84" y2="86" stroke="#5a2e0e" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="3 3"/>
             <text x="47" y="47" text-anchor="middle" font-family="Manrope" font-weight="700" font-size="6" letter-spacing="2" fill="#5a2e0e">ADMIT ONE</text>
             <text x="47" y="80" text-anchor="middle" font-family="Syne" font-weight="800" font-size="34" fill="#2a1505">A</text>
             <path d="M94 54 L95.8 58.2 L100 60 L95.8 61.8 L94 66 L92.2 61.8 L88 60 L92.2 58.2 Z" fill="#2a1505"/>
           </g>`,
      18: `<g mask="url(#eqMask)"><g class="bar">` +
          [22, 40, 58, 76, 92, 76, 58, 40, 22].map((h, i) =>
            `<rect x="${12 + i * 11}" y="${104 - h}" width="8" height="${h}" rx="2" fill="url(#gu)"/>`).join('') +
          `</g></g><rect x="12" y="108" width="96" height="2" rx="1" fill="url(#gu)" opacity=".4"/>`,
    };

    const CONCEPTS = [
      { n: 1, set: 0, name: 'Spotlight A', note: 'A stage spotlight whose beam forms the A: the moment the lights come up.' },
      { n: 2, set: 0, name: 'Halo Ring', note: 'A bold A inside an open, glowing ring. Clean and corporate.' },
      { n: 3, set: 0, name: 'Shirorekha', wm: 'shiro', note: 'The A hangs from a Devanagari headline bar, a nod to Hindi lettering.' },
      { n: 4, set: 0, name: 'New Dawn', note: 'A sun rising over the horizon, because Aarmbh means "beginning".' },
      { n: 5, set: 0, name: 'AM Monoline', note: 'A and M drawn as one continuous gradient line.' },
      { n: 6, set: 0, name: 'Rotating Seal', note: 'A slowly turning seal with the tagline wrapped around the A.' },
      { n: 7, set: 1, name: 'Bloom', note: 'Overlapping petals in the brand colours. Warm and celebratory.' },
      { n: 8, set: 1, name: 'Signature', wm: 'sig', top: true, note: 'A hand-signed A with a swash. Personal and premium.' },
      { n: 9, set: 1, name: 'Lotus Light', note: 'A lotus opening on still water. Graceful for weddings and ceremonies.' },
      { n: 10, set: 1, name: 'Dreamy Aura', wm: 'serif', note: 'A fine serif A floating in a soft haze of colour.' },
      { n: 11, set: 1, name: 'Groovy Retro', wm: 'retro', note: '70s rainbow arcs and a chunky A. Fun and festive.' },
      { n: 12, set: 1, name: 'Confetti Pop', note: 'A bold A in a burst of confetti, made for celebrations.' },
      { n: 13, set: 2, name: 'Diya Glow', top: true, note: 'A glowing diya: the first light of every celebration.' },
      { n: 14, set: 2, name: 'Rangoli', note: 'An eight-petal rangoli with the A at its heart.' },
      { n: 15, set: 2, name: 'Peacock Feather', note: 'The eye of a peacock feather in gold, cyan and violet.' },
      { n: 16, set: 2, name: 'Happy Bounce', wm: 'bounce', note: 'A friendly lowercase a with a bouncing ball. Playful and warm.' },
      { n: 17, set: 2, name: 'Golden Ticket', wm: 'ticket', note: 'An admit-one ticket, because every event is an invitation.' },
      { n: 18, set: 2, name: 'Equalizer A', top: true, note: 'Sound-level bars that rise into an A: music, stage and energy.' },
    ];
    const SETS = [
      ['Classic', '01–06 · confident and timeless'],
      ['Aesthetic & lively', '07–12 · softer, warmer, more playful'],
      ['More ideas', '13–18 · Indian roots, music and celebration'],
    ];

    const pad = (n) => String(n).padStart(2, '0');
    const svg = (n, label) => `<svg viewBox="0 0 120 120" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'} class="mark">${MARKS[n]}</svg>`;
    const wordmark = (c) => {
      if (c.wm === 'sig') return `<div class="wm wm-sig"><b>Aarmbh</b><em>media</em></div>`;
      if (c.wm === 'serif') return `<div class="wm wm-serif"><b>aarmbh</b><em>media</em></div>`;
      if (c.wm === 'retro') return `<div class="wm wm-retro"><b>aarmbh</b><em>media</em></div>`;
      if (c.wm === 'bounce') return `<div class="wm wm-bounce"><b>${[...'AARMBH'].map(l => `<span>${l}</span>`).join('')}</b><em>media</em></div>`;
      return `<div class="wm ${c.wm ? 'wm-' + c.wm : ''}"><b>AARMBH</b><em>media</em></div>`;
    };

    document.getElementById('sets').innerHTML = SETS.map(([title, sub], s) => `
      <section aria-labelledby="set${s}">
        <div class="set-head"><h2 id="set${s}">${title}</h2><span>${sub}</span></div>
        <div class="grid">${CONCEPTS.filter(c => c.set === s).map(c => `
          <article class="card" data-n="${c.n}">
            <div class="tile">
              <span class="num">${pad(c.n)}</span>${c.top ? '<span class="badge">Top pick</span>' : ''}
              ${svg(c.n, `${c.name} logo concept`)}
              ${wordmark(c)}
            </div>
            <div class="meta">
              <h3>${pad(c.n)} · ${c.name}</h3>
              <p>${c.note}</p>
              <div class="row">
                <span class="pill">${svg(c.n)}<b>AARMBH</b><i>media</i></span>
              </div>
              <div class="row">
                <span class="fav"><span>${svg(c.n)}</span><span>${svg(c.n)}</span></span>
                <span class="sizes">32 / 16 px</span>
                <button type="button" class="pick" aria-pressed="false">Pick</button>
              </div>
            </div>
          </article>`).join('')}
        </div>
      </section>`).join('');

    // Tile background + motion toggles
    const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
    const setPressed = (attr, val) => document.querySelectorAll(`[data-${attr}]`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === val)));
    const applyBg = (v) => { document.body.classList.toggle('light-tiles', v === 'light'); setPressed('bg', v); store.set('am-bg', v); };
    const applyMotion = (v) => { document.body.classList.toggle('still', v === 'off'); setPressed('motion', v); store.set('am-motion', v); };
    document.querySelectorAll('[data-bg]').forEach(b => b.addEventListener('click', () => applyBg(b.dataset.bg)));
    document.querySelectorAll('[data-motion]').forEach(b => b.addEventListener('click', () => applyMotion(b.dataset.motion)));
    applyBg(store.get('am-bg') || 'dark');
    applyMotion(store.get('am-motion') || 'on');

    // Picks (one, or several to mix)
    const picked = new Set((store.get('am-picks') || '').split(',').filter(Boolean).map(Number));
    const label = document.getElementById('pickLabel');
    const copyBtn = document.getElementById('copyBtn');
    const pickText = () => [...picked].sort((a, b) => a - b).map(n => `${pad(n)} ${CONCEPTS[n - 1].name}`);
    const render = () => {
      document.querySelectorAll('.card').forEach(card => {
        const on = picked.has(+card.dataset.n);
        card.classList.toggle('picked', on);
        const btn = card.querySelector('.pick');
        btn.setAttribute('aria-pressed', String(on));
        btn.textContent = on ? 'Picked ✓' : 'Pick';
      });
      const list = pickText();
      label.innerHTML = list.length ? `${list.length > 1 ? 'Mix' : 'Pick'}: <strong>${list.join(' + ')}</strong>` : 'Tap <strong>Pick</strong> on any concept';
      copyBtn.disabled = !list.length;
      copyBtn.textContent = 'Copy my pick';
      store.set('am-picks', [...picked].join(','));
    };
    document.querySelectorAll('.pick').forEach(btn => btn.addEventListener('click', () => {
      const n = +btn.closest('.card').dataset.n;
      picked.has(n) ? picked.delete(n) : picked.add(n);
      render();
    }));
    copyBtn.addEventListener('click', async () => {
      const list = pickText();
      const msg = list.length > 1 ? `Please mix logos ${list.join(' and ')}.` : `I pick logo ${list[0]}.`;
      try { await navigator.clipboard.writeText(msg); copyBtn.textContent = 'Copied ✓'; }
      catch (e) { copyBtn.textContent = 'Copy failed'; }
    });
    render();
  </script>
</body>
</html>
